# Nginx reverse proxy for the AI Lab API.
# Replace API_DOMAIN with your hostname (e.g. api.lab.example.com).
#
# Install:
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp scripts/oracle/nginx-ai-lab-api.conf /etc/nginx/sites-available/ai-lab-api
#   sudo sed -i 's/API_DOMAIN/your.actual.domain/g' /etc/nginx/sites-available/ai-lab-api
#   sudo ln -sf /etc/nginx/sites-available/ai-lab-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your.actual.domain

server {
    listen 80;
    server_name API_DOMAIN;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-lived demo streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
