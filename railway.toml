# Railway: connect this repo, then set env vars from DEPLOY.md.
# Build context is the repo root; Dockerfile lives under api/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
